name: Build and managed regression
on:
  push:
    branches: [main, 'css379-screenmenu-*']
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/RockTheVote.ManagedTests.csproj
      - name: Build
        run: dotnet build RockTheVote.csproj -c Release --no-restore
      - name: Managed regression (not native game acceptance)
        run: dotnet run --project tests/RockTheVote.ManagedTests.csproj -c Release --no-restore